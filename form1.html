<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form method="get" action="#">

        <fieldset>
            <legend align="center">Signup Form</legend>

            <label for="fn">First Name : </label>
            <input type="text" name="fn" id="fn" autofocus placeholder="Enter first name" minlength="3" maxlength="15" value="Taksh" hidden > 
            <br><br>

            <label for="ln">Last Name : </label>
            <input type="text" name="ln" id="ln" disabled value="disabled" >
            <br><br>

            <label for="ps">Passwprd : </label>
            <input type="password" name="ps" id="ps" autofocus pattern="[A-Za-z]*[0-9]+[A-Za-z]*" >  
            <br><br>

            <label for="Em">Email : </label>
            <input type="email" name="Em" id="Em" > 
            <br><br>

            <label for="mn">mobile no : </label>
            <input type="tel" name="mn" id="mn" > <br><br>

            Address : <textarea placeholder="Enter Address" rows="2" cols="15"></textarea>
            <br><br>

            City : <select>
                <optgroup label="Gujarat">
                <option disabled selected hidden>--Select city---</option>
                <option>Ahmedabad</option>
                <option>Amreli</option>
                <option>Surat</option>
                <option>Rajkot</option>
                </optgroup>
                <optgroup label="maharashtr">
                <option>Bombay</option>
                <option>Nashik</option>
                </optgroup>
            </select>
            <br><br>

            Gender : 
            <input type="radio" name="g" checked>Male
            <input type="radio" name="g" >Female
            <br><br>

            Hobbies : 
            <input type="checkbox" name="c" >AI<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="checkbox" name="c" >Drawing<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="checkbox" name="c" >Singing
            <br><br>

            Fav color:
            <input type="color" value=#9fe3f4>
            <br><br>


        </fieldset>
        <fieldset>
            <legend align="center" > professional Information</legend>

            CGPA : 
            <input type="number" value="8.8"><br><br>

            Salary Range:2lpa &nbsp;
            <input type="range" min="2" max="15" value="2" step="5">15lpa

            <br><br>
            Resume : <input type="file" multiple accept=".jpg,.png,.html" required><br><br>

            Date of joining:<input type="date" min="2026-09-22" max="2026-12-01"><br><br>

            Fav Subject:
                <input type="text" list="mylist">
                <datalist id="mylist" name="mylist">
                    <option>FSD-1</option>
                    <option>Python-1</option>
                    <option>DE</option>
                    <option>PS</option>
                </datalist>

        </fieldset>

            <input type="submit" value="register">
            <input type="reset" value="Clear">
            <input type="button" value="Click me!">

    </form>
</body>
</html>
