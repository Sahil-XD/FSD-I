<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="5">
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
        </tr>
        <tr>
            <td>D</td>
            <td rowspan="2">F</td>
            <td>h</td>
        </tr>
    </table>
    <br>
    <table border="5">
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
        </tr>
        <tr>
            <td>d</td>
            <td colspan="2">E</td>
        </tr>
    </table>
    <br>
    <table border="2">
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
        </tr>
        <tr>
            <td>D</td>
            <td colspan="2" rowspan="2">E</td>
        </tr>
        <tr>
            <td>F</td>
        </tr>
    </table>
    <br>

    <table border="5" cellpadding="25" rules="all">
        <tr align="center">
            <td bgcolor="red" height="30px" width="30px">0</td>
            <td>1</td>
            <td>2</td>
            <td bgcolor="yellow" width="30px">3</td>
        </tr>
        <tr>
            <td></td> 
            <td bgcolor="purple" colspan="2" rowspan="2" height="30px" width="30px">5</td>
            <td></td>
        </tr>
        <tr>
            <td rowspan="2" height="50px" bgcolor="orange">4</td>
            <td rowspan="2" bgcolor="lightblue">6</td>
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
        </tr>
    </table>
</body>
</html>
