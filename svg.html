<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Rectangle</title>
</head>
<body>
    <svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://w3.org">
        <rect x="20" y="20" width="360" height="160" fill="#F0FDF4" stroke="#16A34A" stroke-width="4" rx="12" ry="12" />
    </svg>

    <svg style="border: 2px solid red" height="200" width="200">

        <line x1="0" y1="0" x2="200" y2="200" stroke="blue"></line>
        <line x1="200" y1="0" x2="0" y2="200" stroke="blue"></line>

        <circle cx="100" cy="50" r="20" fill="aqua" stroke="blue" stroke-width="3"></circle>
        <circle cx="100" cy="150" r="20" fill="aqua" stroke="blue" stroke-width="3"></circle>

        <circle cx="50" cy="100" r="20" fill="aqua" stroke="blue" stroke-width="3"></circle>
        <circle cx="150" cy="100" r="20" fill="aqua" stroke="blue" stroke-width="3"></circle>
    </svg>

    <svg style="border:2px solid red" height="400" width="800">

        <rect x="0" y="0" height="100" width="300" fill="purple"></rect>
        <rect x="350" y="200" height="100" width="70" fill="hotpink" stroke="purple" stroke-width="3"></rect>

        <polygon points="350,200 385,100 420,200" fill="purple" stoke="hotpink">
             </polygon>

        <circle cx="385" cy="150" r="10" fill="red"></circle>
    </svg>

    <svg style="border:2px solid black" height="200" width="200">
        <polygon points="0,70 200,70 0,200 100,0 200,200" fill="none" fill-rule="evenodd" stroke="black" stroke-width="3">

        </polygon>

    </svg>

    <br>
    <svg style="border:2px solid black" height="200" width="400">
        <ellipse cx="200" cy="100" rx="200" ry="100" fill="bisque" stroke="brown" stroke-width="2">
        </ellipse>
        <text x="89" y="128" fill="blue" stroke="red" stroke-width="5" font-size="80px" font-family="arial,sans-serif">LJKU</text>
    </svg>
</body>
</html>
